name: Datenbank-Migrationen

# Wendet neue Migrationen automatisch auf das Supabase-Projekt an, sobald sie
# auf main landen.
#
# Drei Stufen:
#   probelauf    — baut eine leere Wegwerf-Datenbank auf und wendet die
#                  komplette Migrationskette darauf an. Das ist die einzige
#                  Stelle, an der die SQL tatsächlich geprüft wird.
#   trockenlauf  — zeigt nur an, welche Migrationen gegen die Produktion
#                  ausstehen. Er führt nichts aus und prüft nichts.
#   anwenden     — schreibt gegen die Produktion, erst nachdem der probelauf
#                  durch ist.
#
# WICHTIG — Verbindungsweg:
# Die Direktverbindung (db.<ref>.supabase.co) hat nur einen AAAA-Record, ist
# also IPv6-only, solange das IPv4-Add-on nicht gebucht ist. GitHub-Runner haben
# kein IPv6. `supabase db push --linked` würde hier deshalb ohne Fehlermeldung
# hängen, bis der Job ins Timeout läuft. Wir gehen darum ausdrücklich über den
# Session-Pooler, der IPv4 auflöst.
#
# Einzurichtendes Repository-Secret:
#   SUPABASE_DB_URL
#   postgresql://postgres.<project-ref>:<passwort>@aws-0-eu-west-1.pooler.supabase.com:5432/postgres
#   Sonderzeichen im Passwort müssen prozent-kodiert sein (@ -> %40, : -> %3A).
#   Port 5432 ist der Session-Pooler — Port 6543 (Transaction Mode) kann kein
#   DDL und funktioniert für Migrationen nicht.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrations.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrations.yml'

# Zwei gleichzeitig laufende Migrationsjobs auf dieselbe Datenbank sind ein
# sicherer Weg in eine inkonsistente Historie. Nacheinander, nie parallel — und
# einen laufenden Job niemals abbrechen, sonst bricht er mitten im Schema ab.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  # Die eigentliche Prüfung: eine leere Datenbank hochfahren und die gesamte
  # Migrationskette von vorn anwenden. Ein Syntaxfehler, eine vertauschte
  # Reihenfolge oder ein Verweis auf eine Spalte, die es noch nicht gibt, fällt
  # hier auf — und nicht erst beim Schreiben gegen die Produktion.
  #
  # `supabase db start` fährt nur den Postgres-Container hoch (inklusive
  # auth-Schema, das die Migrationen über auth.uid() brauchen).
  # `supabase db reset` wendet danach alle Dateien aus supabase/migrations an.
  #
  # `db lint` setzt plpgsql_check auf die entstandenen Funktionen an. Das greift
  # eine Stufe tiefer als das blosse Anlegen: Postgres prüft beim CREATE nur die
  # Syntax eines plpgsql-Rumpfes, nicht die darin verwendeten Spalten. Genau
  # diese Art Fehler findet der Linter. Gestoppt wird nur bei `error` —
  # Warnungen werden ausgegeben, blockieren aber keinen Merge.
  probelauf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Wegwerf-Datenbank starten
        run: supabase db start

      - name: Komplette Migrationskette anwenden
        run: supabase db reset

      - name: Funktionen auf Typfehler prüfen
        run: supabase db lint --local --level warning --fail-on error

  # Auf Pull Requests: zeigen, welche Migrationen gegen die Produktion
  # ausstehen. ACHTUNG — `--dry-run` listet die Dateien nur auf; es parst die
  # SQL nicht und führt sie nicht aus. Die inhaltliche Prüfung macht
  # ausschliesslich der probelauf-Job darüber.
  trockenlauf:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Ausstehende Migrationen anzeigen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL fehlt — siehe Kommentar am Kopf dieser Datei."
            exit 1
          fi
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

  # Nach dem Merge auf main: tatsächlich anwenden.
  anwenden:
    if: github.event_name == 'push'
    # Gegen die Produktion wird erst geschrieben, wenn dieselben Dateien auf
    # einer leeren Datenbank sauber durchgelaufen sind. Das schützt auch den
    # Fall, in dem jemand ohne Pull Request direkt auf main pusht.
    needs: probelauf
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Gegen Produktion schreiben nur Jobs, die an diese Umgebung gebunden sind.
    # In den Repository-Einstellungen lässt sich darauf ein Reviewer-Zwang
    # legen, falls Migrationen nicht unbeaufsichtigt laufen sollen.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Migrationen anwenden
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL fehlt — siehe Kommentar am Kopf dieser Datei."
            exit 1
          fi
          supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Historie gegenprüfen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
